<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: 14px; border: 1px solid var(--hairline); overflow: hidden; }
  .chip-c { height: 64px; }
  .lab { padding: 8px 10px 10px; background: var(--surface); }
  .lab b { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .lab span { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip-c" style="background:#000000"></div><div class="lab"><b>Page</b><span>#000000</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#1c1c1e"></div><div class="lab"><b>Surface</b><span>#1c1c1e</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#161618"></div><div class="lab"><b>Sunk</b><span>#161618</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#f5f5f7"></div><div class="lab"><b>Text</b><span>#f5f5f7</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#c7c7cc"></div><div class="lab"><b>Text 2</b><span>#c7c7cc</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#8e8e93"></div><div class="lab"><b>Text 3</b><span>#8e8e93</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#0a84ff"></div><div class="lab"><b>Accent</b><span>#0a84ff</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#2a2a2c"></div><div class="lab"><b>Hairline</b><span>255 / 10%</span></div></div>
  </div>
</body></html>
