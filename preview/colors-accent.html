<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px 36px; background: var(--bg); }
  .row { display: flex; gap: 26px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .dot { width: 52px; height: 52px; border-radius: 50%; box-shadow: var(--shadow-rest); }
  .item b { font-size: 12px; font-weight: 600; }
  .item span { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="dot" style="background:#0071e3"></div><b>Blue</b><span>#0071e3</span></div>
    <div class="item"><div class="dot" style="background:#5e5ce6"></div><b>Indigo</b><span>#5e5ce6</span></div>
    <div class="item"><div class="dot" style="background:#1d9d57"></div><b>Green</b><span>#1d9d57</span></div>
    <div class="item"><div class="dot" style="background:#f5731f"></div><b>Orange</b><span>#f5731f</span></div>
    <div class="item"><div class="dot" style="background:#e0489a"></div><b>Pink</b><span>#e0489a</span></div>
    <div class="item"><div class="dot" style="background:#3a3a3c"></div><b>Graphite</b><span>#3a3a3c</span></div>
  </div>
</body></html>
