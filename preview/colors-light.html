<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: 14px; border: 1px solid var(--hairline); overflow: hidden; }
  .chip-c { height: 64px; }
  .lab { padding: 8px 10px 10px; background: var(--surface); }
  .lab b { display: block; font-size: 12.5px; font-weight: 600; }
  .lab span { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip-c" style="background:#f5f5f7"></div><div class="lab"><b>Page</b><span>#f5f5f7</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#ffffff"></div><div class="lab"><b>Surface</b><span>#ffffff</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#f2f2f4"></div><div class="lab"><b>Sunk</b><span>#f2f2f4</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#1d1d1f"></div><div class="lab"><b>Text</b><span>#1d1d1f</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#515154"></div><div class="lab"><b>Text 2</b><span>#515154</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#86868b"></div><div class="lab"><b>Text 3</b><span>#86868b</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#0071e3"></div><div class="lab"><b>Accent</b><span>#0071e3</span></div></div>
    <div class="sw"><div class="chip-c" style="background:#e8e8ea"></div><div class="lab"><b>Hairline</b><span>0,0,0 / 8%</span></div></div>
  </div>
</body></html>
