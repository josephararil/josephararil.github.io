<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 34px 36px; background: var(--bg); display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .wordmark { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .mono { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-size: 13.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #2b6cf6, #6f4cf0);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 1px 3px rgba(0,0,0,0.18); }
  .note { font-size: 12.5px; color: var(--text-3); max-width: 30ch; }
</style></head>
<body>
  <div class="wordmark"><span class="mono">JH</span><span>Joseph Harari</span></div>
  <p class="note">Monogram badge (rounded square, blue→violet) + name in display weight. The badge is replaced by the GitHub avatar once loaded.</p>
</body></html>
