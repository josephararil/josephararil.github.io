<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 36px; background: var(--bg); }
  .card { width: 320px; }
  .tile { aspect-ratio: 16/10; }
  .tile .cat { position: absolute; top: 12px; left: 12px; z-index: 2; font-size: 11px; font-weight: 600; color: #fff; padding: 5px 10px; }
  .tile .glyph { width: 74px; }
  .body { padding: 17px 19px 19px; }
  .ttl { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .tag { margin: 5px 0 0; color: var(--text-2); font-size: 14px; line-height: 1.45; }
  .foot { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-3); }
  .foot .dot { width: 9px; height: 9px; border-radius: 50%; background: #f1e05a; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .open { color: var(--accent); font-weight: 600; }
</style></head>
<body>
  <article class="card">
    <div class="tile" style="background:linear-gradient(140deg,#16b6a4,#0a84d8,#1148b8)">
      <span class="cat frosted">Finance</span>
      <div class="glyph"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><polygon points="32 16 26 26 16 32 22 22" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="2.4" fill="currentColor" stroke="none"/></svg></div>
    </div>
    <div class="body">
      <div class="ttl">Compass</div>
      <p class="tag">Chart your path to financial independence.</p>
      <div class="foot"><span><span class="dot"></span>JavaScript · Updated 2 days ago</span><span class="open">Details ›</span></div>
    </div>
  </article>
</body></html>
