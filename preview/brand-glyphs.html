<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px 36px; background: var(--bg); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .badge { width: 78px; height: 78px; border-radius: var(--r-glyph); display: grid; place-items: center; position: relative; overflow: hidden; box-shadow: var(--shadow-rest); }
  .badge::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 18% 12%, rgba(255,255,255,.32), transparent 55%); }
  .badge svg { width: 40px; height: 40px; color: #fff; position: relative; filter: drop-shadow(0 3px 8px rgba(0,0,0,.22)); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item b { font-size: 11.5px; font-weight: 600; }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="badge" style="background:linear-gradient(140deg,#16b6a4,#0a84d8,#1148b8)"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="19"/><polygon points="32 16 26 26 16 32 22 22" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="2.4" fill="currentColor" stroke="none"/></svg></div><b>compass</b></div>
    <div class="item"><div class="badge" style="background:linear-gradient(140deg,#ff9d54,#ff5fa2,#a855f7)"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12c-3-2.4-7-3.4-12-3.4v26c5 0 9 1 12 3.4 3-2.4 7-3.4 12-3.4v-26c-5 0-9 1-12 3.4z"/><path d="M24 12v26"/></svg></div><b>book</b></div>
    <div class="item"><div class="badge" style="background:linear-gradient(140deg,#ff7eb6,#9b7bff,#ffd16b)"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l4.6 11.4L40 21l-11.4 4.6L24 37l-4.6-11.4L8 21l11.4-4.6z" fill="currentColor" stroke="none"/></svg></div><b>sparkle</b></div>
    <div class="item"><div class="badge" style="background:linear-gradient(140deg,#a7e34d,#34c759,#0aa66a)"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M9 13c7 4 11 11 11 19 0 4-1 8-3 11"/><path d="M39 13c-7 4-11 11-11 19 0 4 1 8 3 11"/></svg></div><b>tennis</b></div>
    <div class="item"><div class="badge" style="background:linear-gradient(140deg,#5b6b86,#3a4458,#222838)"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="17" r="8"/><path d="M9 41c1.5-8.5 7.5-13 15-13s13.5 4.5 15 13"/></svg></div><b>person</b></div>
  </div>
</body></html>
