<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px 36px; background: var(--bg); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent); border-radius: 4px; width: 30px; opacity: .9; }
  .item b { font-size: 11px; font-weight: 600; font-family: var(--font-mono); color: var(--text-2); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><b>4</b></div>
    <div class="item"><div class="bar" style="height:8px"></div><b>8</b></div>
    <div class="item"><div class="bar" style="height:12px"></div><b>12</b></div>
    <div class="item"><div class="bar" style="height:16px"></div><b>16</b></div>
    <div class="item"><div class="bar" style="height:20px"></div><b>20</b></div>
    <div class="item"><div class="bar" style="height:24px"></div><b>24</b></div>
    <div class="item"><div class="bar" style="height:32px"></div><b>32</b></div>
    <div class="item"><div class="bar" style="height:40px"></div><b>40</b></div>
    <div class="item"><div class="bar" style="height:48px"></div><b>48</b></div>
    <div class="item"><div class="bar" style="height:64px"></div><b>64</b></div>
  </div>
  <p style="margin:18px 0 0;font-size:12px;color:var(--text-3)">4px base scale · spacing via flex/grid <code style="font-family:var(--font-mono)">gap</code>, never margin-stacked siblings</p>
</body></html>
